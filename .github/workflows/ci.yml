name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alyac installation
        run: |
          alyac --version

      - name: Check code formatting
        run: |
          alyac fmt . --check

      - name: Check package manifest
        run: |
          alyac pkg list

      - name: Install dependencies
        run: |
          alyac install

      - name: Run package test suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            alyac build tests/test_basic.alya -o test_basic
            gdb -batch -ex "set pagination off" -ex run -ex "bt 30" -ex "info registers" --args ./test_basic
          else
            alyac test
          fi

